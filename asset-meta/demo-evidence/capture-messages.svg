<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2160" viewBox="0 0 1080 2160">
  <!-- Demo evidence only: a fictional chat screenshot, not real messages. -->
  <rect width="1080" height="2160" fill="#0b141a"/>
  <rect width="1080" height="190" fill="#1f2c34"/>
  <circle cx="110" cy="105" r="52" fill="#6b7c85"/>
  <text x="190" y="95" font-family="Arial, sans-serif" font-size="46" fill="#e9edef" font-weight="bold">Wassim</text>
  <text x="190" y="148" font-family="Arial, sans-serif" font-size="34" fill="#8696a0">en ligne</text>
  <text x="540" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#8696a0">14 MARS</text>
  <g font-family="Arial, sans-serif" font-size="42" fill="#e9edef">
    <rect x="40" y="350" width="700" height="150" rx="24" fill="#202c33"/>
    <text x="80" y="430">T'es où ce soir ?</text>
    <text x="680" y="480" font-size="28" fill="#8696a0" text-anchor="end">21:04</text>
    <rect x="300" y="540" width="740" height="150" rx="24" fill="#005c4b"/>
    <text x="340" y="620">Chez moi, je suis mort</text>
    <text x="1000" y="670" font-size="28" fill="#a7c4bd" text-anchor="end">21:06</text>
    <rect x="40" y="730" width="760" height="150" rx="24" fill="#202c33"/>
    <text x="80" y="810">Ok bonne nuit alors</text>
    <text x="740" y="860" font-size="28" fill="#8696a0" text-anchor="end">21:07</text>
    <rect x="200" y="1300" width="840" height="230" rx="24" fill="#005c4b"/>
    <text x="240" y="1385">C'est bon, tout est réglé.</text>
    <text x="240" y="1450">Personne ne saura rien</text>
    <text x="1000" y="1505" font-size="28" fill="#a7c4bd" text-anchor="end">23:12 ✓✓</text>
  </g>
  <rect y="2010" width="1080" height="150" fill="#1f2c34"/>
  <rect x="40" y="2040" width="880" height="90" rx="45" fill="#2a3942"/>
  <text x="90" y="2100" font-family="Arial, sans-serif" font-size="36" fill="#8696a0">Message</text>
</svg>
